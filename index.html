<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Responsive Filter System</title>
    <style>
        /* Base Styling */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eceff1; margin: 0; padding: 10px; }
        .wrapper { max-width: 1400px; margin: auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a237e; border-bottom: 3px solid #1a237e; padding-bottom: 10px; font-size: 1.5rem; }

        /* Responsive Grid System */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 15px; 
        }

        /* Section Styling */
        .section { border: 1px solid #cfd8dc; padding: 12px; border-radius: 8px; background: #fdfdfd; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #fff5f5; border-left: 5px solid #b71c1c; padding: 5px 8px; }
        .section-header h3 { margin: 0; font-size: 13px; color: #b71c1c; }
        .select-all-label { font-size: 11px; font-weight: bold; color: #1b5e20; cursor: pointer; display: flex; align-items: center; gap: 3px; }

        /* Checkbox Buttons Styling */
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .checkbox-group label { 
            font-size: 14px; cursor: pointer; background: #fff; border: 1px solid #bbb; 
            padding: 5px; border-radius: 4px; flex: 1 0 18%; /* Mobile par 5 items per row */
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
        }
        .checkbox-group label:hover { background: #e3f2fd; border-color: #2196f3; }
        .checkbox-group input { margin-right: 4px; }

        /* Buttons Panel */
        .btn-panel { text-align: center; margin: 30px 0; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
        button { padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; width: 100%; transition: 0.3s; }
        .btn-run { background: #1b5e20; color: white; }
        .btn-clear { background: #b71c1c; color: white; }

        /* Result Area */
        #result-area { margin-top: 20px; padding: 15px; border: 2px solid #1a237e; border-radius: 10px; background: #fff; display: none; }
        .result-title { background: #1a237e; color: white; padding: 10px; border-radius: 5px; margin-top: 20px; font-weight: bold; font-size: 14px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 8px; margin-top: 10px; }
        .res-card { background: #e8eaf6; border: 1px solid #3f51b5; padding: 8px; text-align: center; border-radius: 6px; font-weight: bold; color: #1a237e; font-size: 15px; }

        /* Tablet & Desktop Adjustments */
        @media (min-width: 600px) {
            .btn-panel { flex-direction: row; justify-content: center; }
            button { width: auto; min-width: 200px; }
            .checkbox-group label { flex: 0 0 45px; } /* Desktop par fixed size */
        }
    </style>
	<link rel="manifest" href="manifest.json">
<script>
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>

<div class="wrapper">
    <h2>Advance Filter (Mobile Responsive)</h2>

    <div class="grid-container" id="main-grid">
        <script>
            // Section Configurations
            const sections = [
                {title: "1st Figure (Page)", cls: "p1"},
                {title: "2nd Figure (Close)", cls: "p2"},
                {title: "3rd Figure (Center)", cls: "p3"},
                {title: "4th Figure (Fourth)", cls: "p4"},
                {title: "Akra Link (1-2)", cls: "l12"},
                {title: "Center Link (2-3)", cls: "l23"},
                {title: "Pangura Link (3-4)", cls: "l34"},
                {title: "Akra Jama (1+2)", cls: "j12"},
                {title: "Akra Minfi (Baqi)", cls: "m12"},
                {title: "Tendola Jama (1+2+3)", cls: "jTen"},
                {title: "Pangura Jama (1+2+3+4)", cls: "jPan"},
                {title: "1-3 Jama", cls: "j13"}, {title: "1-3 Minfi", cls: "m13"},
                {title: "2-3 Jama", cls: "j23"}, {title: "2-3 Minfi", cls: "m23"},
                {title: "1-4 Jama", cls: "j14"}, {title: "1-4 Minfi", cls: "m14"},
                {title: "2-4 Jama", cls: "j24"}, {title: "2-4 Minfi", cls: "m24"},
                {title: "3-4 Jama", cls: "j34"}, {title: "3-4 Minfi", cls: "m34"}
            ];

            const grid = document.getElementById('main-grid');
            sections.forEach(s => {
                let html = `
                    <div class="section">
                        <div class="section-header">
                            <h3>${s.title}</h3>
                            <label class="select-all-label">
                                <input type="checkbox" onclick="toggleAll('${s.cls}', this)"> All
                            </label>
                        </div>
                        <div class="checkbox-group">
                `;
                for(let i=0; i<=9; i++) {
                    html += `<label><input type="checkbox" class="${s.cls}" value="${i}">${i}</label>`;
                }
                html += `</div></div>`;
                grid.insertAdjacentHTML('beforeend', html);
            });

            function toggleAll(cls, source) {
                const checkboxes = document.getElementsByClassName(cls);
                for(let cb of checkboxes) cb.checked = source.checked;
            }
        </script>
    </div>

    <div class="btn-panel">
        <button class="btn-run" onclick="mainLogic()">Hasil Nikalen</button>
        <button class="btn-clear" onclick="location.reload()">Sab Saaf Karein</button>
    </div>

    <div id="result-area">
        <div id="res-meta" style="font-size: 18px; font-weight: bold; color: #1a237e;"></div>
        <div class="result-title">Akray Result</div><div class="result-grid" id="akra-grid"></div>
        <div class="result-title">Tendolay Result</div><div class="result-grid" id="tendola-grid"></div>
        <div class="result-title">Panguray Result</div><div class="result-grid" id="pangura-grid"></div>
    </div>
</div>

<script>
    function getChecked(cls) { return Array.from(document.querySelectorAll('.'+cls+':checked')).map(el => parseInt(el.value)); }
    function mufrid(n) { let s = Math.abs(n).toString().split('').reduce((a, b) => a + parseInt(b), 0); return s > 9 ? mufrid(s) : s; }

    function mainLogic() {
        const p1 = getChecked('p1'), p2 = getChecked('p2'), p3 = getChecked('p3'), p4 = getChecked('p4');
        const l12 = getChecked('l12'), l23 = getChecked('l23'), l34 = getChecked('l34');
        const j12 = getChecked('j12'), m12 = getChecked('m12'), jTen = getChecked('jTen'), jPan = getChecked('jPan');
        const j13 = getChecked('j13'), m13 = getChecked('m13'), j23 = getChecked('j23'), m23 = getChecked('m23');
        const j14 = getChecked('j14'), m14 = getChecked('m14'), j24 = getChecked('j24'), m24 = getChecked('m24'), j34 = getChecked('j34'), m34 = getChecked('m34');

        if(!p1.length || !p2.length) { alert("Page aur Close zaroori hain!"); return; }

        let akray = [], tendolay = [], panguray = [];

        for(let a of p1) {
            for(let b of p2) {
                if(l12.length && !l12.includes(a) && !l12.includes(b)) continue;
                if(j12.length && !j12.includes(mufrid(a+b))) continue;
                if(m12.length && !m12.includes(mufrid(Math.abs(a-b)))) continue;
                akray.push(""+a+b);

                if(p3.length) {
                    for(let c of p3) {
                        if(l23.length && !l23.includes(b) && !l23.includes(c)) continue;
                        if(jTen.length && !jTen.includes(mufrid(a+b+c))) continue;
                        if(j13.length && !j13.includes(mufrid(a+c))) continue;
                        if(m13.length && !m13.includes(mufrid(Math.abs(a-c)))) continue;
                        if(j23.length && !j23.includes(mufrid(b+c))) continue;
                        if(m23.length && !m23.includes(mufrid(Math.abs(b-c)))) continue;
                        tendolay.push(""+a+b+c);

                        if(p4.length) {
                            for(let d of p4) {
                                if(l34.length && !l34.includes(c) && !l34.includes(d)) continue;
                                if(jPan.length && !jPan.includes(mufrid(a+b+c+d))) continue;
                                if(j14.length && !j14.includes(mufrid(a+d))) continue;
                                if(m14.length && !m14.includes(mufrid(Math.abs(a-d)))) continue;
                                if(j24.length && !j24.includes(mufrid(b+d))) continue;
                                if(m24.length && !m24.includes(mufrid(Math.abs(b-d)))) continue;
                                if(j34.length && !j34.includes(mufrid(c+d))) continue;
                                if(m34.length && !m34.includes(mufrid(Math.abs(c-d)))) continue;
                                panguray.push(""+a+b+c+d);
                            }
                        }
                    }
                }
            }
        }

        document.getElementById('result-area').style.display = 'block';
        document.getElementById('res-meta').innerText = "Processing Mukammal";
        document.getElementById('akra-grid').innerHTML = akray.map(x => `<div class="res-card">${x}</div>`).join('') || "N/A";
        document.getElementById('tendola-grid').innerHTML = tendolay.map(x => `<div class="res-card">${x}</div>`).join('') || "N/A";
        document.getElementById('pangura-grid').innerHTML = panguray.map(x => `<div class="res-card">${x}</div>`).join('') || "N/A";
        
        // Mobile par results ki taraf scroll karein
        document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
